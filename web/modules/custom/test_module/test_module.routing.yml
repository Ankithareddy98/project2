test_module.recipie_page:
  path: "/recipiepage"
  defaults:
    _controller: '\Drupal\test_module\Controller\RecipieController::myRecipiePage'
    _title: "My first page in D8"
  requirements:
    _permission: "access content"

test_module.recipie_page_edited:
  path: "/new-recipiepage"
  defaults:
    _controller: '\Drupal\test_module\Controller\UpdatedRecipieController::newRecipiePage'
    _title: "My first page in D8"
  requirements:
    _permission: "access content"

test_module.form:
  path: "/todo"
  defaults:
    _form: '\Drupal\test_module\Form\FormController'
    _title: "ToDo Form"
  requirements:
    _permission: "access content"

test_module.task_delete:
  path: "/todo/delete/{created}"
  defaults:
    _controller: '\Drupal\test_module\Form\FormController::deleteTask'
    _title: "Delete Task"
  requirements:
    _permission: "access content"
    created: '\d+'

test_module.task_edit:
  path: "/todo/edit/{created}"
  defaults:
    _form: '\Drupal\test_module\Form\EditTaskForm'
    _title: "Edit Task"
  requirements:
    _permission: "access content"
    created: '\d+'

test_module.task_page:
  path: "/taskpage"
  defaults:
    _controller: '\Drupal\test_module\Controller\CacheController::taskPage'
    _title: "Tasks Page"
  requirements:
    _permission: "access content"
