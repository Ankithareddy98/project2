test_module.recipie_page:
  path: "/recipiepage"
  defaults:
    _controller: '\Drupal\test_module\Controller\RecipieController::myRecipiePage'
    _title: "My first page in D8"
  requirements:
    _permission: "access content"

test_module.form:
  path: "/todo"
  defaults:
    _form: '\Drupal\test_module\Form\FormController'
    _title: "ToDo Form"
  requirements:
    _permission: "access content"

test_module.task_delete:
  path: "/todo/delete/{task_id}"
  defaults:
    _controller: '\Drupal\test_module\Form\FormController::deleteTask'
    _title: "Delete Task"
  requirements:
    _permission: "access content"

test_module.task_edit:
  path: "/todo/edit/{task_id}"
  defaults:
    _controller: '\Drupal\test_module\Form\FormController::editTask'
    _title: "Edit Task"
  requirements:
    _permission: "access content"
